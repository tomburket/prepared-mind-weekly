<style>
/* ============ PMWR DIAL — change these two lines to retune ============
   ACTIVE threads below. To run T10 (grocery basket) or T11 (tariffs),
   add 't10' / 't11' to the ACTIVE set in the script. S5 spine vs secondary
   is set by tier:'spine' on s5 in the THREADS data. ==================== */
:root{
  --cream:#efe9da; --cream-2:#e6e0d0; --paper:#f4f1ea;
  --ink:#1f1c16; --ink-2:#534d40; --ink-3:#8a8372;
  --rule:#d8d1bf; --rule-2:#e6e0d1;
  --accent:#a9742a; --accent-2:#c79447;
  --field:#15140f; --field-2:#1e1c15; --star:#efe9da;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Inter",system-ui,sans-serif; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--cream);
  overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.08)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--cream);will-change:transform,opacity}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---- transitions ---- */
.view{transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .34s}
.enter-right{transform:translateX(100%)}
.enter-left{transform:translateX(-26%);opacity:.6}
.exit-left{transform:translateX(-26%);opacity:.6}
.exit-right{transform:translateX(100%)}
.fade-in{opacity:0}
@media (prefers-reduced-motion:reduce){.view{transition:none}}

/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:12px;padding:14px 18px 12px;
  border-bottom:1px solid var(--rule);background:var(--cream);flex:none;min-height:54px}
.bar.dark{background:var(--field);border-bottom:1px solid #2a2820}
.back{appearance:none;background:none;border:0;cursor:pointer;padding:4px;margin:-4px;
  color:var(--ink-2);display:flex;align-items:center;font-size:15px;font-family:inherit}
.bar.dark .back{color:#c9c3b2}
.back svg{width:18px;height:18px}
.bar-title{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.bar.dark .bar-title{color:#8b8674}
.bar-mast{font-family:"Newsreader",serif;font-weight:500;font-size:17px;color:var(--ink)}

/* ============ EDITION VIEW ============ */
.ed-head{padding:26px 22px 18px;border-bottom:1px solid var(--rule)}
.ed-kicker{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.ed-title{font-family:"Newsreader",serif;font-weight:500;font-size:30px;line-height:1.08;
  letter-spacing:.004em;margin:0 0 8px}
.ed-date{font-size:13.5px;color:var(--ink-2)}
.ed-note{font-size:12.5px;color:var(--ink-3);margin-top:14px;line-height:1.5}

/* ---- altitude switcher ---- */
.altbar{display:flex;gap:0;margin-top:18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.altbar button{flex:1;appearance:none;background:none;border:0;cursor:pointer;padding:12px 4px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);border-right:1px solid var(--rule)}
.altbar button:last-child{border-right:0}
.altbar button.active{color:var(--accent)}
.altbar button:not(.active):hover{color:var(--ink)}

/* ---- pathway directory ---- */
.dir-head{padding:24px 22px 14px;border-bottom:1px solid var(--rule)}
.dir-kick{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.dir-title{font-family:"Newsreader",serif;font-weight:500;font-size:26px;margin:0 0 6px}
.dir-sub{font-size:13px;color:var(--ink-2)}
.dir-group{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);padding:20px 22px 6px}
.dir-row{display:flex;align-items:center;gap:13px;padding:15px 22px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.dir-row:hover{background:var(--paper)}
.dir-dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.dir-body{flex:1;min-width:0}
.dir-name{font-family:"Newsreader",serif;font-size:16.5px;line-height:1.25;color:var(--ink)}
.dir-meta{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);margin-top:4px}
.dir-arr{color:var(--accent);font-size:14px;flex:none}

.card{padding:22px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:11px;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow .sec{color:var(--accent)}
.eyebrow .sep{color:var(--rule)}
.card h2{font-family:"Newsreader",serif;font-weight:500;font-size:21px;line-height:1.22;
  margin:0 0 10px;letter-spacing:.003em;color:var(--ink)}
.card .sum{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin:0 0 14px}
.card .src{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  letter-spacing:.02em;margin-bottom:16px}

/* ---- the foot-line cue ---- */
.footline{appearance:none;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;border-top:1px solid var(--rule-2);padding:13px 0 2px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;
  display:flex;align-items:center;gap:9px;color:var(--accent);font-family:inherit}
.footline{font-family:"IBM Plex Mono",monospace}
.footline:hover{color:var(--ink)}
.footline .ftxt{flex:1;line-height:1.4}
.footline .arr{font-size:13px}
.footline.loose{color:var(--ink-3)}
.footline.loose:hover{color:var(--accent)}
.fork-label{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);border-top:1px solid var(--rule-2);padding-top:13px;margin-bottom:-2px}
.footline.forked{border-top:0;padding-top:9px}
.fork-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.edge.fork{stroke:rgba(201,148,71,.45);stroke-width:1.1;stroke-dasharray:1 5}
.edge.fork.lit{stroke:rgba(214,176,99,.9);stroke-width:1.5}

/* ============ STREAM VIEW ============ */
.stream-head{padding:24px 22px 18px;border-bottom:1px solid var(--rule);background:var(--paper)}
.stream-tier{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.stream-dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
.stream-title{font-family:"Newsreader",serif;font-weight:500;font-size:25px;line-height:1.12;
  margin:0 0 9px;color:var(--ink)}
.stream-blurb{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:0 0 18px}
.connect-btn{appearance:none;background:var(--field);color:var(--cream);border:0;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:11px 16px;border-radius:2px;display:inline-flex;align-items:center;gap:9px;font-family:inherit}
.connect-btn:hover{background:#23211a}
.connect-btn .glyph{font-size:14px}

.stream-list{padding:6px 0 40px}
.s-item{display:flex;gap:14px;padding:16px 22px;border-bottom:1px solid var(--rule-2);
  cursor:pointer;align-items:flex-start;position:relative}
.s-item:hover{background:var(--paper)}
.s-item.here{background:var(--cream-2)}
.s-rail{flex:none;width:14px;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.s-node{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;z-index:1}
.s-item.here .s-node{box-shadow:0 0 0 4px var(--cream-2),0 0 0 5px var(--accent)}
.s-line{position:absolute;top:0;bottom:0;left:28px;width:1px;background:var(--rule)}
.s-item:first-child .s-line{top:21px}
.s-item:last-child .s-line{bottom:auto;height:21px}
.s-body{flex:1;min-width:0}
.s-ed{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.s-head{font-family:"Newsreader",serif;font-size:16px;line-height:1.28;color:var(--ink)}
.s-here-tag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);margin-top:5px}

/* ============ CARD (full) VIEW ============ */
.full-scroll{padding:26px 24px 48px}
.full-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.full-eyebrow .sep{color:var(--rule)}
.full h1{font-family:"Newsreader",serif;font-weight:500;font-size:27px;line-height:1.16;
  margin:0 0 18px;letter-spacing:.003em}
.full .sum{font-size:15.5px;line-height:1.62;color:var(--ink-2);margin:0 0 22px}
.full .src{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--rule);padding-top:16px;margin-bottom:22px}

/* ============ MAP VIEW ============ */
.map-wrap{flex:1;position:relative;background:radial-gradient(150% 64% at 50% 104%,rgba(150,116,66,.20),transparent 58%),radial-gradient(120% 92% at 50% 22%,#221d14,var(--field) 60%,#0f0e0a);overflow:hidden;touch-action:none}
.map-svg{width:100%;height:100%;display:block}
.edge{stroke:rgba(239,233,218,.14);stroke-width:1;fill:none}
.edge.lit{stroke-width:1.7;opacity:.95}
.node-dot{fill:var(--star)}
.node-ring{fill:none;stroke:rgba(239,233,218,.5);stroke-width:1.1}
.node-lbl{font-family:"Inter",sans-serif;font-size:10px;fill:rgba(239,233,218,.5);pointer-events:none}
.node.dim .node-dot,.node.dim .node-ring,.node.dim .node-lbl{opacity:.16}
.node.here .node-dot{fill:var(--accent-2)}
.node.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.node.pulse{animation:none}}
.map-legend{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 18px;
  background:linear-gradient(transparent,rgba(16,15,11,.92)34%);display:flex;flex-direction:column;gap:3px}
.map-thread-name{font-family:"Newsreader",serif;font-size:18px;color:var(--cream);margin-bottom:2px}
.map-hint{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;color:#8b8674;line-height:1.5}
.map-ctrls{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px}
.map-ctrls button{width:38px;height:38px;border-radius:50%;border:1px solid #3a372c;
  background:rgba(30,28,21,.8);color:var(--cream);font-size:18px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center}
.map-ctrls button:active{background:#2a2820}
.map-tip{position:absolute;top:14px;left:14px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.04em;color:#8b8674;max-width:55%;line-height:1.5}
</style>
</head>

const CORPUS=CARDS.filter(c=>c.t!=="dup");
const CURRENT_EDITION=13;

/* ---- derived ---- */
function effectiveThread(c){ return (c.t!=="curious" && ACTIVE.has(c.t)) ? c.t : null; }
function pname(tid){ return THREADS[tid].short || THREADS[tid].name; }
function threadCards(tid){ return CORPUS.filter(c=>c.t===tid).sort((a,b)=>a.ed-b.ed); }
function curiousCards(){ return CORPUS.filter(c=>!effectiveThread(c)); }
const byId=Object.fromEntries(CORPUS.map(c=>[c.id,c]));

/* ===================== APP / NAV ===================== */
const app=document.getElementById("app");
const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
let stack=[]; // view history

function go(viewObj,dir){
  const prev=app.querySelector(".view");
  const el=viewObj.el;
  el.classList.add("view");
  if(viewObj.dark) {} 
  app.appendChild(el);
  if(dir==="push"){
    el.classList.add("enter-right");
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
      el.classList.remove("enter-right");
      if(prev){prev.classList.add("exit-left");}
    });});
  } else if(dir==="pop"){
    el.classList.add("enter-left");
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
      el.classList.remove("enter-left");
      if(prev){prev.classList.add("exit-right");}
    });});
  } else { // fade (map)
    el.classList.add("fade-in");
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{el.classList.remove("fade-in");});});
  }
  const delay=reduce?0:360;
  if(prev) setTimeout(()=>{ if(prev.parentNode) prev.remove(); },delay);
}

function push(builder){ const v=builder(); stack.push(builder); go(v,"push"); }
function pop(){
  if(stack.length<=1) return;
  stack.pop();
  const v=stack[stack.length-1]();
  go(v,"pop");
}
function replaceTop(builder){ stack[stack.length-1]=builder; const v=builder(); go(v,"fade"); }

function backIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>';}
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}

/* ---- foot-line text ---- */
function footlineFor(card){
  const tid=effectiveThread(card);
  if(!tid){
    return {loose:true,txt:"Stands alone \u00b7 wander",};
  }
  const cards=threadCards(tid);
  const before=cards.filter(c=>c.ed<card.ed).length;
  const name=THREADS[tid].name;
  let phrase;
  if(before===0) phrase="a new path";
  else if(before===1) phrase="1 earlier point";
  else phrase=before+" earlier points";
  return {loose:false,txt:name+" \u00b7 "+phrase,tid:tid};
}

function pathBefore(card,tid){ return threadCards(tid).filter(c=>c.ed<card.ed).length; }
function phraseFor(b){ return b===0?"a new path":(b===1?"1 earlier point":b+" earlier points"); }

function renderFootline(card){
  const wrap=document.createElement("div");
  const primary=effectiveThread(card);
  if(!primary){
    const b=el('<button class="footline loose"><span class="ftxt">Stands alone \u00b7 wander</span><span class="arr">\u2192</span></button>');
    b.addEventListener("click",()=>{
      const pool=curiousCards().filter(x=>x.id!==card.id);
      const next=pool[Math.floor(Math.random()*pool.length)];
      push(()=>buildCard(next.id,{}));
    });
    wrap.appendChild(b); return wrap;
  }
  const tids=[primary];
  if(card.t2 && ACTIVE.has(card.t2)) tids.push(card.t2);
  const fork=tids.length>1;
  if(fork) wrap.appendChild(el('<div class="fork-label">This point forks \u2014 two ways on</div>'));
  tids.forEach(tid=>{
    const before=pathBefore(card,tid);
    const dot=fork?'<span class="fork-dot" style="background:'+THREADS[tid].color+'"></span>':'';
    const b=el('<button class="footline'+(fork?' forked':'')+'"><span class="ftxt">'+dot+esc(pname(tid))+' \u00b7 '+phraseFor(before)+'</span><span class="arr">\u2192</span></button>');
    b.addEventListener("click",()=>push(()=>buildStream(tid,card.id)));
    wrap.appendChild(b);
  });
  return wrap;
}

/* ===================== VIEW: EDITION ===================== */
function buildEdition(){
  const cards=CORPUS.filter(c=>c.ed===CURRENT_EDITION);
  const v=el('<div class="view"></div>');
  v.appendChild(el(
    '<div class="bar"><span class="bar-mast">The Prepared Mind, Weekly Reader</span></div>'));
  const sc=el('<div class="scroll"></div>');
  const head=el(
    '<div class="ed-head">'+
    '<div class="ed-kicker">Edition 13</div>'+
    '<h1 class="ed-title">This week\u2019s briefing</h1>'+
    '<div class="ed-date">June 25, 2026</div>'+
    '<div class="ed-note">Each entry below shapes the Prepared Mind. Some stand alone. Others connect across a broader landscape with pathways to follow. Explore. Extend. Keep asking the second question.</div>'+
    '<div class="altbar">'+
      '<button class="active" data-alt="points">Points</button>'+
      '<button data-alt="pathways">Pathways</button>'+
      '<button data-alt="landscape">Landscape</button>'+
    '</div>'+
    '</div>');
  head.querySelector('[data-alt="pathways"]').addEventListener("click",()=>push(buildPathwayDirectory));
  head.querySelector('[data-alt="landscape"]').addEventListener("click",()=>push(()=>buildMap(null,null)));
  sc.appendChild(head);
  cards.forEach(c=>{
    const card=el('<div class="card"></div>');
    card.innerHTML=
      '<div class="eyebrow"><span class="sec">'+esc(c.sec)+'</span><span class="sep">/</span><span>'+esc(c.tag)+'</span></div>'+
      '<h2>'+esc(c.h)+'</h2>'+
      '<div class="sum">'+esc(c.s)+'</div>'+
      '<div class="src">'+esc(c.src)+'</div>';
    card.appendChild(renderFootline(c));
    sc.appendChild(card);
  });
  v.appendChild(sc);
  return {el:v};
}

/* ===================== VIEW: PATHWAY DIRECTORY ===================== */
function buildPathwayDirectory(){
  const v=el('<div class="view"></div>');
  const bar=el('<div class="bar"><button class="back">'+backIcon()+'</button><span class="bar-title">Pathways</span></div>');
  bar.querySelector(".back").addEventListener("click",pop);
  v.appendChild(bar);
  const sc=el('<div class="scroll"></div>');
  sc.appendChild(el(
    '<div class="dir-head">'+
    '<div class="dir-kick">Across the landscape</div>'+
    '<h2 class="dir-title">Pathways</h2>'+
    '<div class="dir-sub">Every path running through the briefing. The rest stands alone.</div>'+
    '</div>'));
  ["spine","secondary"].forEach(tier=>{
    const ids=Object.keys(THREADS).filter(t=>ACTIVE.has(t)&&THREADS[t].tier===tier);
    if(!ids.length)return;
    sc.appendChild(el('<div class="dir-group">'+(tier==="spine"?"Spine paths":"Secondary paths")+'</div>'));
    ids.forEach(tid=>{
      const th=THREADS[tid]; const n=threadCards(tid).length;
      const row=el('<div class="dir-row">'+
        '<span class="dir-dot" style="background:'+th.color+';color:'+th.color+'"></span>'+
        '<div class="dir-body"><div class="dir-name">'+esc(pname(tid))+'</div>'+
        '<div class="dir-meta">'+n+' points \u00b7 Ed '+threadCards(tid)[0].ed+'\u2013'+threadCards(tid)[n-1].ed+'</div></div>'+
        '<span class="dir-arr">\u2192</span></div>');
      row.addEventListener("click",()=>push(()=>buildStream(tid,null)));
      sc.appendChild(row);
    });
  });
  v.appendChild(sc);
  return {el:v};
}

/* ===================== VIEW: STREAM ===================== */
function buildStream(tid,hereId){
  const th=THREADS[tid]; const cards=threadCards(tid);
  const v=el('<div class="view"></div>');
  const bar=el('<div class="bar"><button class="back">'+backIcon()+'</button><span class="bar-title">Path \u00b7 '+cards.length+' points</span></div>');
  bar.querySelector(".back").addEventListener("click",pop);
  v.appendChild(bar);
  const sc=el('<div class="scroll"></div>');
  const head=el('<div class="stream-head"></div>');
  head.innerHTML=
    '<div class="stream-tier"><span class="stream-dot" style="background:'+th.color+';color:'+th.color+'"></span>'+th.tier+' path</div>'+
    '<h2 class="stream-title">'+esc(pname(tid))+'</h2>'+
    '<p class="stream-blurb">'+esc(th.blurb)+'</p>';
  const cbtn=el('<button class="connect-btn">See it on the landscape \u2192</button>');
  cbtn.addEventListener("click",()=>push(()=>buildMap(tid,hereId)));
  head.appendChild(cbtn);
  sc.appendChild(head);

  const list=el('<div class="stream-list"></div>');
  cards.forEach(c=>{
    const here=c.id===hereId;
    const item=el('<div class="s-item'+(here?' here':'')+'">'+
      '<div class="s-line"></div>'+
      '<div class="s-rail"><span class="s-node"></span></div>'+
      '<div class="s-body">'+
      '<div class="s-ed">Edition '+c.ed+' \u00b7 '+EDITION_DATES[c.ed]+'</div>'+
      '<div class="s-head">'+esc(c.h)+'</div>'+
      (here?'<div class="s-here-tag">you\u2019re reading this one</div>':'')+
      '</div></div>');
    item.addEventListener("click",()=>push(()=>buildCard(c.id,{thread:tid})));
    list.appendChild(item);
  });
  sc.appendChild(list);
  v.appendChild(sc);
  return {el:v};
}

/* ===================== VIEW: CARD (full) ===================== */
function buildCard(id,opts){
  opts=opts||{};
  const c=byId[id];
  const v=el('<div class="view"></div>');
  const bar=el('<div class="bar"><button class="back">'+backIcon()+'</button><span class="bar-title">'+esc(c.sec)+'</span></div>');
  bar.querySelector(".back").addEventListener("click",pop);
  v.appendChild(bar);
  const sc=el('<div class="scroll"></div>');
  const wrap=el('<div class="full full-scroll"></div>');
  wrap.innerHTML=
    '<div class="full-eyebrow"><span>'+esc(c.sec)+'</span><span class="sep">/</span><span>Edition '+c.ed+'</span><span class="sep">/</span><span>'+EDITION_DATES[c.ed]+'</span></div>'+
    '<h1>'+esc(c.h)+'</h1>'+
    '<div class="sum">'+esc(c.s)+'</div>'+
    '<div class="src">Source &nbsp;\u00b7&nbsp; '+esc(c.src)+'</div>';
  wrap.appendChild(renderFootline(c));
  sc.appendChild(wrap);
  v.appendChild(sc);
  return {el:v};
}

/* ===================== VIEW: LANDSCAPE (terrain + markers) ===================== */
const CLUSTERS={
  s3:[250,210],s1:[560,260],
  t9:[140,470],s2:[440,520],t14:[730,440],
  s4:[260,770],t8:[560,720],t7:[800,810],
  s5:[200,1030],t12:[490,1020],t13:[750,1090]
};
function buildMap(focusTid,hereId){
  const v=el('<div class="view"></div>');
  v.appendChild((()=>{const b=el('<div class="bar dark"><button class="back">'+backIcon()+'</button><span class="bar-title">The landscape</span></div>');b.querySelector(".back").addEventListener("click",pop);return b;})());
  const wrap=el('<div class="map-wrap"></div>');
  const W=900,H=1300;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","map-svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("preserveAspectRatio","xMidYMid slice");

  // position nodes
  const pos={};
  const activeThreadIds=Object.keys(CLUSTERS).filter(t=>ACTIVE.has(t));
  activeThreadIds.forEach(tid=>{
    const c=CLUSTERS[tid]; const cards=threadCards(tid);
    const n=cards.length; const R=Math.min(95,28+n*9);
    cards.forEach((card,i)=>{
      const ang=(i/n)*Math.PI*2 - Math.PI/2;
      pos[card.id]={x:c[0]+Math.cos(ang)*R*(n>1?1:0),y:c[1]+Math.sin(ang)*R*(n>1?1:0),tid:tid};
      if(n===1) pos[card.id]={x:c[0],y:c[1],tid:tid};
    });
  });
  // curious scattered around the margins
  const cur=curiousCards();
  cur.forEach((card,i)=>{
    const ang=(i/cur.length)*Math.PI*2;
    const rx=W/2+Math.cos(ang)*(W*0.52), ry=H/2+Math.sin(ang)*(H*0.46);
    pos[card.id]={x:Math.max(30,Math.min(W-30,rx)),y:Math.max(70,Math.min(H-40,ry)),tid:null};
  });

  // edges: chronological chain within each active thread
  const eg=document.createElementNS("http://www.w3.org/2000/svg","g");
  activeThreadIds.forEach(tid=>{
    const cards=threadCards(tid);
    for(let i=0;i<cards.length-1;i++){
      const a=pos[cards[i].id],b=pos[cards[i+1].id]; if(!a||!b)continue;
      const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
      ln.setAttribute("x1",a.x);ln.setAttribute("y1",a.y);ln.setAttribute("x2",b.x);ln.setAttribute("y2",b.y);
      ln.setAttribute("class","edge"+(tid===focusTid?" lit":""));
      if(tid===focusTid) ln.setAttribute("stroke",THREADS[tid].color);
      else if(focusTid) ln.style.opacity=".18";
      eg.appendChild(ln);
    }
  });
  // fork edges: a point that sits on two paths branches across the terrain
  CORPUS.forEach(card=>{
    if(!(card.t2 && ACTIVE.has(card.t2) && ACTIVE.has(card.t))) return;
    if(!pos[card.id]) return;
    let near=null,bd=1e9;
    threadCards(card.t2).forEach(o=>{ if(o.id!==card.id && pos[o.id]){ const d=Math.abs(o.ed-card.ed); if(d<bd){bd=d;near=o;} } });
    if(!near) return;
    const a=pos[card.id], b=pos[near.id];
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",a.x);ln.setAttribute("y1",a.y);ln.setAttribute("x2",b.x);ln.setAttribute("y2",b.y);
    const lit=(focusTid===card.t||focusTid===card.t2);
    ln.setAttribute("class","edge fork"+(lit?" lit":""));
    if(focusTid && !lit) ln.style.opacity=".22";
    eg.appendChild(ln);
  });
  svg.appendChild(eg);

  // nodes
  const ng=document.createElementNS("http://www.w3.org/2000/svg","g");
  CORPUS.forEach(card=>{
    const p=pos[card.id]; if(!p)return;
    const tid=p.tid; const focused=tid===focusTid;
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    let cls="node"; if(focusTid && !focused) cls+=" dim";
    if(card.id===hereId) cls+=" here pulse";
    g.setAttribute("class",cls);
    g.style.cursor="pointer";
    const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);
    dot.setAttribute("r",card.id===hereId?6.5:(tid?4.4:3));
    dot.setAttribute("class","node-dot");
    if(tid && focused) dot.setAttribute("fill",card.id===hereId?"#c79447":THREADS[tid].color);
    if(tid && focused && card.id!==hereId) dot.setAttribute("stroke","rgba(239,233,218,.22)"),dot.setAttribute("stroke-width","1");
    g.appendChild(dot);
    if(card.id===hereId){
      const lbl=document.createElementNS("http://www.w3.org/2000/svg","text");
      lbl.setAttribute("x",p.x+10);lbl.setAttribute("y",p.y+4);
      lbl.setAttribute("class","node-lbl");lbl.setAttribute("fill","#efe9da");
      lbl.style.fontSize="11px";
      lbl.textContent="you are here";
      g.appendChild(lbl);
    }
    g.addEventListener("click",()=>push(()=>buildCard(card.id,{})));
    ng.appendChild(g);
  });
  svg.appendChild(ng);
  wrap.appendChild(svg);

  // pan/zoom
  let vb={x:0,y:0,w:W,h:H};
  // start focused on the thread cluster
  if(focusTid && CLUSTERS[focusTid]){
    const c=CLUSTERS[focusTid]; const zw=W*0.62, zh=zw*(H/W)* (H/W>1?1:1);
    const zhh=zw*(H/W);
    vb={x:Math.max(0,Math.min(W-zw,c[0]-zw/2)),y:Math.max(0,Math.min(H-zhh,c[1]-zhh/2)),w:zw,h:zhh};
  }
  function applyVB(){svg.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h);}
  applyVB();
  let drag=null;
  wrap.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener("pointermove",e=>{
    if(!drag)return;
    const sx=vb.w/wrap.clientWidth, sy=vb.h/wrap.clientHeight;
    vb.x=drag.vx-(e.clientX-drag.x)*sx; vb.y=drag.vy-(e.clientY-drag.y)*sy;
    vb.x=Math.max(-200,Math.min(W+200-vb.w,vb.x)); vb.y=Math.max(-200,Math.min(H+200-vb.h,vb.y));
    applyVB();
  });
  wrap.addEventListener("pointerup",e=>{drag=null;});
  wrap.addEventListener("pointercancel",()=>{drag=null;});
  function zoom(f){
    const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
    vb.w=Math.max(260,Math.min(W*1.3,vb.w*f)); vb.h=vb.w*(H/W);
    vb.x=cx-vb.w/2; vb.y=cy-vb.h/2; applyVB();
  }
  wrap.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY>0?1.12:0.89);},{passive:false});

  const ctrls=el('<div class="map-ctrls"></div>');
  const zin=el('<button aria-label="Zoom in">+</button>');const zout=el('<button aria-label="Zoom out">\u2212</button>');
  const zall=el('<button aria-label="Whole landscape" style="font-size:15px">\u2295</button>');
  zin.addEventListener("click",()=>zoom(0.8));zout.addEventListener("click",()=>zoom(1.25));
  zall.addEventListener("click",()=>{vb={x:0,y:0,w:W,h:H};applyVB();});
  ctrls.append(zin,zout,zall);
  wrap.appendChild(ctrls);

  wrap.appendChild(el('<div class="map-tip">drag to move \u00b7 tap a point to open it \u00b7 \u2295 for the whole landscape</div>'));
  const leg=el('<div class="map-legend">'+
    '<div class="map-thread-name" style="color:'+(focusTid?THREADS[focusTid].color:'#efe9da')+'">'+(focusTid?esc(pname(focusTid)):"The whole briefing")+'</div>'+
    '<div class="map-hint">'+(focusTid?"This path lit. Faded points are everything else across the landscape \u2014 tap any to cross over.":"Every point across the landscape.")+'</div>'+
    '</div>');
  wrap.appendChild(leg);
  v.appendChild(wrap);
  return {el:v,dark:true};
}

/* ===================== BOOT ===================== */
function boot(){
  push(buildEdition);
  var m=(location.hash||"").match(/stream=([a-z0-9]+)(?:&from=([a-z0-9]+))?/);
  if(m && THREADS[m[1]] && ACTIVE.has(m[1])){
    push(function(){return buildStream(m[1], m[2]||null);});
  }
}
boot();
</script>
