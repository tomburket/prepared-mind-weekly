<!DOCTYPE html>
<html lang="en">
<head>
<!--{{META}}-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Prepared Mind, Weekly Reader &mdash; {{TITLE_DATE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
--ink: #111111; --ink-mid: #3a3a3a; --ink-light: #666666;
--rule: #d8d8d8; --accent: #c0392b; --accent-dark: #8b1a13;
--bg: #f9f8f5; --card: #ffffff;
--tag-ai: #dce8ff; --tag-ai-text: #0d3f8f;
--tag-people: #d6f0d8; --tag-people-text: #1a5c1e;
--tag-market: #fdecd0; --tag-market-text: #8b4400;
--tag-board: #ecdff5; --tag-board-text: #4a0e7a;
--tag-search: #fad9e3; --tag-search-text: #8b0033;
--tag-culture: #cff0ec; --tag-culture-text: #004d43;
--tag-workforce: #e2e0f3; --tag-workforce-text: #3b2f7a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 19px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
.masthead { background: #1a1a1a; color: white; padding: 28px 20px 24px; }
.masthead-date { font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: #f0c040; margin-bottom: 8px; }
.masthead-title { font-family: 'Libre Baskerville', serif; font-size: 22px; font-weight: 700; line-height: 1.15; color: white; margin-bottom: 8px; }
.masthead-meta { font-size: 13px; color: #bbbbbb; font-weight: 400; }
.summary-strip { background: #2a2a2a; padding: 16px 20px; display: flex; gap: 28px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.summary-strip::-webkit-scrollbar { display: none; }
.summary-pill { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.summary-pill-num { font-family: 'Libre Baskerville', serif; font-size: 26px; font-weight: 700; color: #f0c040; line-height: 1; }
.summary-pill-label { font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: #cccccc; line-height: 1.3; }
.section-nav { background: var(--card); border-bottom: 1px solid var(--rule); padding: 12px 20px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.section-nav::-webkit-scrollbar { display: none; }
.section-nav a { font-size: 12px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-light); text-decoration: none; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 3px; white-space: nowrap; flex-shrink: 0; transition: background 0.15s, color 0.15s; }
.section-nav a:hover { background: var(--ink); color: white; border-color: var(--ink); }
.content { max-width: 740px; margin: 0 auto; padding: 40px 20px 72px; }
section { margin-bottom: 8px; }
.section-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; padding-top: 44px; }
.section-number { font-family: 'Libre Baskerville', serif; font-size: 13px; color: var(--ink-light); flex-shrink: 0; }
.section-title { font-family: 'Libre Baskerville', serif; font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; }
.section-rule { border: none; border-top: 1px solid var(--rule); margin: 0; }
.item-card { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 24px 22px 20px; margin-bottom: 16px; scroll-margin-top: 20px; }
.item-header { margin-bottom: 6px; }
.item-tag { display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; margin-bottom: 10px; }
.tag-ai { background: var(--tag-ai); color: var(--tag-ai-text); }
.tag-board { background: var(--tag-board); color: var(--tag-board-text); }
.tag-culture { background: var(--tag-culture); color: var(--tag-culture-text); }
.tag-search { background: var(--tag-search); color: var(--tag-search-text); }
.tag-market { background: var(--tag-market); color: var(--tag-market-text); }
.tag-people { background: var(--tag-people); color: var(--tag-people-text); }
.tag-workforce { background: var(--tag-workforce); color: var(--tag-workforce-text); }
.item-headline { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; line-height: 1.3; color: var(--ink); margin-bottom: 8px; }
.item-source { font-size: 12px; font-weight: 500; letter-spacing: 0.3px; color: var(--ink-light); text-transform: uppercase; margin-bottom: 14px; }
.item-summary { font-size: 17px; line-height: 1.65; color: var(--ink-mid); margin-bottom: 18px; }
.implication-block { border-left: 3px solid var(--accent); padding-left: 14px; margin-bottom: 18px; }
.implication-label { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
.implication-text { font-size: 17px; line-height: 1.6; color: var(--ink); }
.item-link { display: inline-block; font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; letter-spacing: 0.2px; }
.item-link:hover { text-decoration: underline; }
.back-to-top { display: block; text-align: center; margin-top: 48px; font-size: 13px; font-weight: 500; color: var(--ink-light); text-decoration: none; letter-spacing: 0.5px; }
.back-to-top:hover { color: var(--ink); }
.footer { background: #1a1a1a; color: #999; padding: 28px 20px; font-size: 14px; font-weight: 400; text-align: center; line-height: 1.8; }
.footer strong { color: white; font-weight: 500; }
@media (min-width: 640px) {
.masthead { padding: 40px 32px 32px; }
.masthead-title { font-size: 28px; }
.content { padding: 48px 28px 72px; }
.item-card { padding: 28px 28px 24px; }
.item-headline { font-size: 22px; }
.item-summary { font-size: 18px; }
.implication-text { font-size: 18px; }
}
</style>
</head>
<body id="top">

<header class="masthead">
<div class="masthead-date">{{MAST_DATE}}</div>
<div class="masthead-title">The Prepared Mind, Weekly Reader</div>
<div class="masthead-meta">{{N_ITEMS}} Items &nbsp;&bull;&nbsp; {{TOPICS}}</div>
</header>

<div class="summary-strip" aria-label="Coverage summary">
{{PILLS}}
</div>

<nav class="section-nav" aria-label="Jump to section">
{{NAV}}
</nav>

<main class="content">

{{SECTIONS}}

<a class="back-to-top" href="#top">&uarr; Back to top</a>

</main>

<footer class="footer">
<strong>The Prepared Mind, Weekly Reader</strong><br>
Prepared for Tony Sarsam by Tom Burket, word/cairn<br>
{{FOOT_DATE}} &middot; Edition No. {{ED_NO}}
<br><a href="/landscape/" style="color:#f0c040;text-decoration:none;font-size:13px;">Explore the Landscape &rarr;</a>
&nbsp;&nbsp;<a href="/editions/" style="color:#f0c040;text-decoration:none;font-size:13px;">Past editions &rarr;</a>
</footer>

<script src="/landscape/footlines.js?v={{ED_NO}}" defer></script>

</body>
</html>
